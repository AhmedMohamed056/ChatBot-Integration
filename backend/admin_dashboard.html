<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    :root{
      --ink: #0E2B2C;
      --panel: #133B3B;
      --panel-2: #16474A;
      --gold: #E3A857;
      --gold-soft: #F0C685;
      --sand: #F4EFE6;
      --sage: #9FB8B3;
      --line: rgba(244,239,230,0.10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1100px 600px at 85% -10%, rgba(227,168,87,0.18), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(227,168,87,0.10), transparent 60%), var(--ink);
      color: var(--sand);
      font-family: 'Tajawal', sans-serif;
      padding: 20px;
    }
    h1, h2, h3, .brand { font-family: 'Cairo', sans-serif; }
    .admin-shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 20px;
      min-height: calc(100vh - 40px);
    }
    .sidebar {
      background: linear-gradient(155deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .brand { font-size: 20px; margin-bottom: 10px; color: var(--sand); }
    .nav-item {
      border: 1px solid var(--line);
      background: rgba(244,239,230,0.03);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--sand);
      cursor: pointer;
      font-weight: 700;
      text-align: right;
    }
    .nav-item.active {
      background: rgba(227,168,87,0.12);
      border-color: rgba(227,168,87,0.42);
      color: var(--gold-soft);
    }
    .main-panel {
      background: rgba(244,239,230,0.02);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }
    .page-title { font-size: 28px; margin: 0 0 8px; }
    .subtext { color: var(--sage); margin: 0 0 24px; line-height: 1.8; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }
    .card {
      background: linear-gradient(155deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }
    .label { color: var(--sage); font-size: 14px; margin-bottom: 10px; }
    .value { font-size: 28px; font-family: 'Cairo', sans-serif; color: var(--gold-soft); margin-bottom: 6px; }
    .muted { color: var(--sage); font-size: 13px; }
    .latest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--gold);
      color: #1a1206;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      text-decoration: none;
      display: inline-block;
      margin-top: 12px;
    }
    .btn.secondary {
      background: transparent;
      color: var(--sand);
      border: 1px solid var(--line);
    }
    .btn.danger { background: #8b2f2f; color: #fff; }
    .drop-zone {
      border: 1.5px dashed rgba(227,168,87,0.45);
      border-radius: 16px;
      padding: 24px;
      background: rgba(227,168,87,0.05);
      text-align: center;
      margin-bottom: 18px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--sand);
      font-size: 13px;
    }
    table.data-table th {
      text-align: right;
      padding: 8px 0;
      color: var(--sage);
      border-bottom: 1px solid var(--line);
    }
    table.data-table td {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .form-grid {
      display: grid;
      gap: 14px;
      max-width: 640px;
    }
    .form-grid label {
      display: grid;
      gap: 8px;
      color: var(--sand);
      font-size: 14px;
    }
    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(244,239,230,0.06);
      padding: 12px 14px;
      color: var(--sand);
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
    }
    .form-grid textarea { min-height: 120px; resize: vertical; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .message { color: var(--gold-soft); margin-top: 12px; min-height: 20px; }
    .upload-stage {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(227,168,87,0.08);
      border: 1px solid rgba(227,168,87,0.25);
      color: var(--gold-soft);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 20px;
    }
    .upload-stage .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .campaign-row { cursor: pointer; transition: background 0.15s; }
    .campaign-row:hover { background: rgba(227,168,87,0.08); }
    .campaign-row.selected { background: rgba(227,168,87,0.14); }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-active { background: rgba(95,176,120,0.18); color: #7fd49a; border: 1px solid rgba(95,176,120,0.35); }
    .status-inactive { background: rgba(159,184,179,0.15); color: var(--sage); border: 1px solid var(--line); }
    .details-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 50;
      display: flex;
      justify-content: flex-end;
    }
    .details-panel {
      width: min(720px, 100%);
      height: 100%;
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: 24px;
      box-shadow: -20px 0 60px -20px rgba(0,0,0,0.6);
    }
    .details-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .details-close {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--sand);
      border-radius: 999px;
      width: 36px; height: 36px;
      cursor: pointer;
      font-size: 18px;
    }
    .update-card {
      background: rgba(244,239,230,0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .update-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .meta-chip {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(227,168,87,0.10);
      color: var(--gold-soft);
      border: 1px solid rgba(227,168,87,0.22);
    }
    .update-section { margin-bottom: 12px; }
    .update-section .section-label { color: var(--sage); font-size: 12px; margin-bottom: 4px; }
    .update-section .section-value { color: var(--sand); font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .readonly-banner {
      background: rgba(227,168,87,0.08);
      border: 1px solid rgba(227,168,87,0.25);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--gold-soft);
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.7;
    }
    /* ===== Structured record presentation (presentation-only) ===== */
    .activity-list { display: grid; gap: 14px; }
    .activity-card {
      background: linear-gradient(155deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
    }
    .activity-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .activity-title {
      font-family: 'Cairo', sans-serif; font-size: 18px; color: var(--gold-soft);
      display: flex; align-items: center; gap: 8px; margin: 0;
    }
    .date-chip {
      font-size: 12px; padding: 5px 12px; border-radius: 999px;
      background: rgba(227,168,87,0.10); color: var(--gold-soft);
      border: 1px solid rgba(227,168,87,0.22); white-space: nowrap;
    }
    .kv-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px 18px;
    }
    .kv-label {
      color: var(--sage); font-size: 12px; margin-bottom: 3px;
      display: flex; align-items: center; gap: 6px;
    }
    .kv-value {
      color: var(--sand); font-size: 14px; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap;
    }
    .kv-value.strong { color: var(--gold-soft); font-weight: 700; }
    .card-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn.small { padding: 8px 16px; font-size: 13px; margin-top: 0; }
    /* Centered modal (View Details) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 60; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-card {
      width: min(680px, 100%); max-height: 90vh; overflow-y: auto;
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line); border-radius: 18px; padding: 24px;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
    }
    .section-block { margin-bottom: 20px; }
    .section-title {
      font-family: 'Cairo', sans-serif; font-size: 15px; color: var(--sand);
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px; margin: 0 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .diff-list { display: grid; gap: 10px; }
    .diff-row {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      background: rgba(244,239,230,0.03);
    }
    .diff-field { font-size: 13px; font-weight: 700; color: var(--gold-soft); margin-bottom: 8px; }
    .diff-values { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .diff-new .kv-value { color: #9fe0b0; }
    .raw-block { margin-top: 8px; }
    .raw-toggle {
      background: transparent; border: none; color: var(--sage);
      cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 13px; padding: 6px 0;
    }
    .raw-toggle:hover { color: var(--gold-soft); }
    .raw-json {
      margin: 8px 0 0; padding: 14px; border-radius: 12px;
      background: rgba(0,0,0,0.28); border: 1px solid var(--line);
      color: var(--sage); font-size: 12px; line-height: 1.6;
      direction: ltr; text-align: left;
      white-space: pre-wrap; word-break: break-word;
      max-height: 320px; overflow: auto;
    }
    @media (max-width: 600px) {
      .diff-values { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="admin-root"></div>
  <script>
    const { useState, useEffect } = React;

    const NAV_ITEMS = [
      { id: 'dashboard', label: 'Dashboard' },
      { id: 'knowledge', label: 'Knowledge Base' },
      { id: 'campaigns', label: 'Campaigns' },
      { id: 'reports', label: 'Reports' },
      { id: 'audit', label: 'Audit Logs' },
      { id: 'settings', label: 'Settings' },
    ];

    // Placeholder stats used when the /admin/stats endpoint is unavailable.
    // No backend is implemented here — these are display-only fallbacks.
    const PLACEHOLDER_STATS = {
      total_knowledge_files: 0,
      total_campaigns: 0,
      total_campaign_messages: 0,
      total_visitor_questions: 0,
      total_unanswered_questions: 0,
      latest_uploaded_file: null,
      latest_campaign_update: null,
      latest_visitor_question: null,
      latest_unanswered_question: null,
    };

    async function apiGet(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Request failed');
      return res.json();
    }

    async function apiSend(url, method, body) {
      const options = { method, headers: {} };
      if (body instanceof FormData) {
        options.body = body;
      } else if (body !== undefined) {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body);
      }
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Request failed');
      return data;
    }

    // ===== Structured record presentation (presentation-only, no backend changes) =====
    // The WhatsApp supervisor pipeline stores a full campaign snapshot as a
    // Python-dict string inside CampaignUpdate.new_value, exposed by the API as
    // `extracted_info`. These helpers parse that blob CLIENT-SIDE so admins see
    // readable fields instead of a raw dict/JSON blob. Nothing is invented: every
    // value rendered comes from the API response; missing fields render as "—".
    const el = React.createElement;

    // Tolerant parser for Python literals (single quotes, None/True/False) and JSON.
    function parsePyLiteral(s) {
      let i = 0;
      const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
      function parseString() {
        const q = s[i++];
        let out = '';
        while (i < s.length) {
          const c = s[i++];
          if (c === '\\') {
            const n = s[i++];
            out += n === 'n' ? '\n' : n === 't' ? '\t' : n === 'r' ? '\r' : n;
          } else if (c === q) {
            return out;
          } else {
            out += c;
          }
        }
        throw new Error('unterminated string');
      }
      function parseAtom() {
        const start = i;
        while (i < s.length && !/[,:}\])\s]/.test(s[i])) i++;
        const tok = s.slice(start, i);
        if (tok === 'None' || tok === 'null') return null;
        if (tok === 'True' || tok === 'true') return true;
        if (tok === 'False' || tok === 'false') return false;
        if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(tok)) return Number(tok);
        if (tok === '') throw new Error('empty atom');
        return tok;
      }
      function parseArray(close) {
        i++; const arr = []; ws();
        if (s[i] === close) { i++; return arr; }
        while (i < s.length) {
          arr.push(parseValue()); ws();
          if (s[i] === ',') { i++; ws(); if (s[i] === close) { i++; return arr; } continue; }
          if (s[i] === close) { i++; return arr; }
          throw new Error('bad array');
        }
        throw new Error('unterminated array');
      }
      function parseObject() {
        i++; const obj = {}; ws();
        if (s[i] === '}') { i++; return obj; }
        while (i < s.length) {
          ws();
          const key = parseValue(); ws();
          if (s[i] !== ':') throw new Error('expected :');
          i++;
          obj[key] = parseValue(); ws();
          if (s[i] === ',') { i++; continue; }
          if (s[i] === '}') { i++; return obj; }
          throw new Error('bad object');
        }
        throw new Error('unterminated object');
      }
      function parseValue() {
        ws();
        const ch = s[i];
        if (ch === '{') return parseObject();
        if (ch === '[') return parseArray(']');
        if (ch === '(') return parseArray(')');
        if (ch === "'" || ch === '"') return parseString();
        return parseAtom();
      }
      return parseValue();
    }

    function parseStructured(raw) {
      if (raw == null) return null;
      if (typeof raw === 'object') return raw;
      const s = String(raw).trim();
      if (!s) return null;
      try { return JSON.parse(s); } catch (e) { /* not JSON */ }
      try { return parsePyLiteral(s); } catch (e) { return null; }
    }

    function dash(v) {
      if (v === null || v === undefined) return '—';
      const s = String(v).trim();
      return s === '' ? '—' : s;
    }

    // Classify a WhatsApp message as a bare confirmation ("OK", "نعم", ...) vs a
    // real business request ("غير وصف الحملة"). Used only by the Campaign Details
    // panel so a confirmation never gets shown as the original request.
    function isConfirmationText(raw) {
      if (!raw) return false;
      let s = String(raw).trim().toLowerCase();
      s = s.replace(/[ً-ٰٟ]/g, '');       // strip Arabic diacritics
      s = s.replace(/[إأآ]/g, 'ا').replace(/ة/g, 'ه');   // normalize alef / ta-marbuta
      s = s.replace(/[^\p{L}]/gu, '');                    // drop spaces, punctuation, emoji
      if (!s) return false;
      const CONFIRM = new Set([
        'ok', 'okay', 'okey', 'k', 'kk', 'yes', 'y', 'yep', 'yeah', 'yup',
        'sure', 'fine', 'confirm', 'confirmed', 'done', 'agree', 'agreed',
        'approve', 'approved', 'correct',
        'نعم', 'ايوه', 'ايوا', 'اجل', 'موافق', 'موافقه', 'تمام', 'تم',
        'اوك', 'اوكي', 'اوكيه', 'صح', 'صحيح', 'ماشي', 'حسنا', 'اكيد'
      ]);
      return CONFIRM.has(s);
    }

    function deriveAction(parsed, raw) {
      const status = parsed && typeof parsed === 'object'
        ? parsed.status
        : (typeof parsed === 'string' ? parsed : raw);
      return status === 'deleted' ? 'Campaign Deleted' : 'Campaign Updated';
    }

    // Normalize a Campaign-Activity item OR a Campaign-messages row into one shape.
    function normalizeRecord(src) {
      const raw = src.extracted_info;
      const parsed = parseStructured(raw);
      const isObj = parsed && typeof parsed === 'object' && !Array.isArray(parsed);
      const owner = isObj && parsed.owner && typeof parsed.owner === 'object' ? parsed.owner : {};
      return {
        raw: raw,
        snap: isObj ? parsed : null,
        campaignName: (isObj && parsed.campaign_name) || src.campaign || src.campaign_name || '',
        supervisor: owner.display_name || src.updated_by || '',
        phone: owner.phone_number || '',
        status: isObj ? parsed.status : (typeof parsed === 'string' ? parsed : ''),
        version: isObj ? parsed.current_version : null,
        description: isObj ? parsed.description : null,
        source: src.source || '',
        originalMessage: src.last_message || src.original_message || '',
        confirmationMessage: src.confirmation_message || '',
        timestamp: src.date || src.created_at || '',
        updateId: (src.id !== undefined && src.id !== null) ? src.id : null,
        auditId: (src.audit_id !== undefined && src.audit_id !== null) ? src.audit_id : null,
        outboxId: (src.outbox_id !== undefined && src.outbox_id !== null) ? src.outbox_id : null,
        action: deriveAction(parsed, raw),
      };
    }

    // Content fields shown in the "Changed Fields" section (old is unknown → "—").
    const RECORD_CONTENT_FIELDS = [
      ['description', 'Description'],
      ['campaign_type', 'Campaign Type'],
      ['status', 'Status'],
      ['start_date', 'Start Date'],
      ['end_date', 'End Date'],
      ['notes', 'Notes'],
    ];

    function KV({ label, value, icon, strong }) {
      return el('div', { className: 'kv' },
        el('div', { className: 'kv-label' }, icon ? el('span', null, icon) : null, label),
        el('div', { className: 'kv-value' + (strong ? ' strong' : '') }, dash(value))
      );
    }

    function SectionBlock({ title, icon, children }) {
      return el('div', { className: 'section-block' },
        el('div', { className: 'section-title' }, icon ? el('span', null, icon) : null, title),
        children
      );
    }

    function RawJsonBlock({ raw }) {
      const [open, setOpen] = useState(false);
      let pretty = raw == null ? '—' : String(raw);
      const parsed = parseStructured(raw);
      if (parsed && typeof parsed === 'object') {
        try { pretty = JSON.stringify(parsed, null, 2); } catch (e) { /* keep raw */ }
      }
      return el('div', { className: 'raw-block' },
        el('button', { className: 'raw-toggle', onClick: () => setOpen((o) => !o) },
          (open ? '▲ ' : '▼ ') + 'Show Raw JSON'),
        open ? el('pre', { className: 'raw-json' }, pretty) : null
      );
    }

    function ChangedFields({ snap }) {
      if (!snap || typeof snap !== 'object') {
        return el('div', { className: 'kv-value' }, '—');
      }
      return el('div', { className: 'diff-list' },
        RECORD_CONTENT_FIELDS.map((pair) =>
          el('div', { className: 'diff-row', key: pair[0] },
            el('div', { className: 'diff-field' }, '📌 ' + pair[1]),
            el('div', { className: 'diff-values' },
              el('div', { className: 'diff-old' },
                el('div', { className: 'kv-label' }, 'Old'),
                el('div', { className: 'kv-value' }, '—')
              ),
              el('div', { className: 'diff-new' },
                el('div', { className: 'kv-label' }, 'New'),
                el('div', { className: 'kv-value' }, dash(snap[pair[0]]))
              )
            )
          )
        )
      );
    }

    // Full 4-section detail used by the Campaign-Activity "View Details" modal.
    function RecordDetails({ record }) {
      return el('div', null,
        el(SectionBlock, { title: 'Campaign & Supervisor', icon: '📋' },
          el('div', { className: 'kv-grid' },
            el(KV, { label: 'Campaign Name', value: record.campaignName, icon: '📢', strong: true }),
            el(KV, { label: 'Supervisor', value: record.supervisor, icon: '👤' }),
            el(KV, { label: 'Phone Number', value: record.phone, icon: '📱' }),
            el(KV, { label: 'Action', value: record.action, icon: '📝' }),
            el(KV, { label: 'Source', value: record.source, icon: '🔗' }),
            el(KV, { label: 'Version', value: record.version, icon: '🔖' }),
            el(KV, { label: 'Timestamp', value: formatUploadDate(record.timestamp), icon: '🕒' })
          )
        ),
        el(SectionBlock, { title: 'Changed Fields', icon: '📌' },

    const KB_ACCEPTED_EXTENSIONS = ['.pdf', '.docx', '.doc', '.txt', '.csv', '.xlsx'];
    const KB_ACCEPT_ATTR = '.pdf,.docx,.doc,.txt,.csv,.xlsx';

    function formatFileSize(kb) {
      if (kb == null) return '—';
      if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB';
      return kb + ' KB';
    }

    function formatUploadDate(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString();
      } catch {
        return iso;
      }
    }

    function KnowledgeBaseView() {
      const [files, setFiles] = useState([]);
      const [message, setMessage] = useState('');
      const [uploading, setUploading] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [stage, setStage] = useState('');

      function loadFiles() {
        apiGet('/admin/files').then((data) => setFiles(data.files || [])).catch(() => setFiles([]));
      }

      useEffect(() => { loadFiles(); }, []);

      function validateFile(file) {
        if (!file) return false;
        const ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
        if (!KB_ACCEPTED_EXTENSIONS.includes(ext)) {
          setMessage('Unsupported file type. Supported: PDF, DOCX, DOC, TXT, CSV, XLSX');
          return false;
        }
        return true;
      }

      async function uploadFile(file, replaceFilename = null) {
        if (!file) return;
        if (!validateFile(file)) return;
        setUploading(true);
        setMessage('');
        setStage('Uploading...');
        const stageTimers = [];
        stageTimers.push(setTimeout(() => setStage('Analyzing document...'), 1500));
        stageTimers.push(setTimeout(() => setStage('Creating AI Knowledge...'), 4000));
        stageTimers.push(setTimeout(() => setStage('Saving knowledge base...'), 30000));
        const form = new FormData();
        form.append('file', file);
        const url = replaceFilename
          ? `/admin/files/${encodeURIComponent(replaceFilename)}/replace`
          : '/upload';
        try {
          const data = await apiSend(url, 'POST', form);
          stageTimers.forEach(clearTimeout);
          setStage('Completed successfully.');
          setMessage(data.message || 'Uploaded successfully');
          loadFiles();
          setTimeout(() => setStage(''), 3000);
        } catch (err) {
          stageTimers.forEach(clearTimeout);
          setStage('');
          setMessage(err.message || 'Upload failed');
        } finally {
          setUploading(false);
        }
      }

      async function deleteFile(filename) {
        if (!window.confirm(`Delete "${filename}"? This will rebuild the knowledge base.`)) return;
        try {
          const data = await apiSend(`/admin/files/${encodeURIComponent(filename)}`, 'DELETE');
          setMessage(data.message || 'Deleted');
          loadFiles();
        } catch (err) {
          setMessage(err.message || 'Delete failed');
        }
      }

      return React.createElement('div', null,
        React.createElement('h1', { className: 'page-title' }, 'Knowledge Base'),
        React.createElement('p', { className: 'subtext' }, 'ارفع الملفات ليتم فهرستها داخل نظام RAG الحالي.'),
        React.createElement('div', { className: 'card' },
          React.createElement('div', {
            className: 'drop-zone',
            style: dragging ? { borderColor: 'var(--gold-soft)', background: 'rgba(227,168,87,0.12)' } : null,
            onDragOver: (e) => { e.preventDefault(); setDragging(true); },
            onDragLeave: () => setDragging(false),
            onDrop: (e) => {
              e.preventDefault();
              setDragging(false);
              const file = e.dataTransfer.files?.[0];
              if (file) uploadFile(file);
            }
          },
            React.createElement('h3', { style: { margin: '0 0 10px', fontSize: '18px' } }, uploading ? 'جاري الرفع...' : 'اسحب الملف أو اختره'),
            React.createElement('p', { className: 'muted' }, 'PDF, DOCX, DOC, TXT, CSV, XLSX'),
            React.createElement('label', { className: 'btn', htmlFor: 'upload-input' }, uploading ? 'Uploading...' : 'اختيار ملف'),
            React.createElement('input', {
              id: 'upload-input',
              type: 'file',
              accept: KB_ACCEPT_ATTR,
              style: { display: 'none' },
              onChange: (e) => uploadFile(e.target.files?.[0])
            }),
            React.createElement('div', { className: 'message' }, message),
            uploading && stage && React.createElement('div', { className: 'upload-stage' },
              React.createElement('span', { className: 'dot' }),
              React.createElement('span', null, stage)
            )
          ),
          React.createElement('table', { className: 'data-table' },
            React.createElement('thead', null,
              React.createElement('tr', null,
                ['File Name', 'Type', 'Size', 'Upload Date', 'Actions'].map((h) =>
                  React.createElement('th', { key: h }, h)
                )
              )
            ),
            React.createElement('tbody', null,
              files.length === 0
                ? React.createElement('tr', null, React.createElement('td', { colSpan: 5 }, 'No files uploaded yet.'))
                : files.map((item) =>
                    React.createElement('tr', { key: item.filename },
                      React.createElement('td', null, item.filename),
                      React.createElement('td', null, item.type),
                      React.createElement('td', null, formatFileSize(item.size_kb)),
                      React.createElement('td', null, formatUploadDate(item.uploaded_at)),
                      React.createElement('td', null,

      return React.createElement('div', null,
        React.createElement('h1', { className: 'page-title' }, 'Reports'),
        React.createElement('p', { className: 'subtext' }, 'تقارير نشاط الحملات وأسئلة الزوار.'),
        React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
          React.createElement('h2', { style: { marginTop: 0 } }, 'Campaign Activity'),
          campaignReport.length === 0
            ? React.createElement('div', { className: 'muted' }, 'No campaign activity yet.')
            : React.createElement('div', { className: 'activity-list' },
                campaignReport.map((item, idx) => {
                  const record = normalizeRecord(item);
                  return React.createElement(ActivityCard, {
                    key: idx,
                    record: record,
                    onView: () => setActivityModal(record)
                  });
                })
              )
        ),
        React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
          React.createElement('h2', { style: { marginTop: 0 } }, 'Visitor Questions'),
          React.createElement('table', { className: 'data-table' },
            React.createElement('thead', null,
              React.createElement('tr', null,
                React.createElement('th', null, 'Top Questions'),
                React.createElement('th', null, 'Question Count')
              )
            ),
            React.createElement('tbody', null,
              topQuestions.length === 0
                ? React.createElement('tr', null, React.createElement('td', { colSpan: 2 }, 'No visitor questions yet.'))
                : topQuestions.map((item, idx) =>
                    React.createElement('tr', { key: idx },
                      React.createElement('td', null, item.question),
                      React.createElement('td', null, item.question_count)
                    )
                  )
            )
          )
        ),
        React.createElement('div', { className: 'card' },
          React.createElement('h2', { style: { marginTop: 0 } }, 'Questions Without Answers'),
          React.createElement('table', { className: 'data-table' },
            React.createElement('thead', null,
              React.createElement('tr', null,
                React.createElement('th', null, 'Question'),
                React.createElement('th', null, 'Date')
              )
            ),
            React.createElement('tbody', null,
              unanswered.length === 0
                ? React.createElement('tr', null, React.createElement('td', { colSpan: 2 }, 'No unanswered questions.'))
                : unanswered.map((item, idx) =>
                    React.createElement('tr', { key: idx },
                      React.createElement('td', null, item.question),
                      React.createElement('td', null, item.asked_at)
                    )
                  )
            )
          )
        ),
        activityModal && React.createElement(ActivityDetailsModal, {
          record: activityModal,
          onClose: () => setActivityModal(null)
        })
      );
    }

    const CALENDAR_ACCEPTED_EXTENSIONS = ['.xlsx', '.xls'];
    const CALENDAR_ACCEPT_ATTR = '.xlsx,.xls';
    const CAMPAIGN_FILE_ACCEPTED_EXTENSIONS = ['.xlsx', '.xls'];
    const CAMPAIGN_FILE_ACCEPT_ATTR = '.xlsx,.xls';

    function SettingsView() {
      const [settings, setSettings] = useState({
        bot_name: '',
        system_prompt: '',
        gemini_api_key: '',
        gemini_model: 'gemini-2.5-flash',
        campaign_file: '',
        calendar_file: '',
      });
      const [message, setMessage] = useState('');
      const [campaignUploading, setCampaignUploading] = useState(false);
      const [importingCampaign, setImportingCampaign] = useState(false);
      const [importResult, setImportResult] = useState(null);
      const [calendarUploading, setCalendarUploading] = useState(false);
      const [campaignDragging, setCampaignDragging] = useState(false);
      const [calendarDragging, setCalendarDragging] = useState(false);
      const [passwordOld, setPasswordOld] = useState('');
      const [passwordNew, setPasswordNew] = useState('');
      const [passwordConfirm, setPasswordConfirm] = useState('');
      const [passwordMsg, setPasswordMsg] = useState('');

      useEffect(() => {
        apiGet('/admin/settings').then(setSettings).catch(() => {});
      }, []);

      async function saveBotSettings(e) {
        e.preventDefault();
        try {
          const payload = {
            bot_name: settings.bot_name || '',
            system_prompt: settings.system_prompt || '',
          };
          const data = await apiSend('/admin/settings', 'PUT', payload);
          setSettings((prev) => ({ ...prev, ...data.settings }));
          setMessage('Bot settings saved');
        } catch (err) {
          setMessage(err.message || 'Save failed');
        }
      }

      async function saveAiSettings(e) {
        e.preventDefault();
        try {
          const payload = {
            gemini_api_key: settings.gemini_api_key || '',
            gemini_model: settings.gemini_model || 'gemini-2.5-flash',
          };
          const data = await apiSend('/admin/settings', 'PUT', payload);
          setSettings((prev) => ({ ...prev, ...data.settings }));
          setMessage('AI settings saved');
        } catch (err) {
          setMessage(err.message || 'Save failed');
        }
      }

      async function uploadCampaignFile(file) {
        if (!file) return;
        const ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
        if (!CAMPAIGN_FILE_ACCEPTED_EXTENSIONS.includes(ext)) {
          setMessage('Unsupported file type. Supported: XLSX, XLS');
          return;
        }
        setCampaignUploading(true);
        setMessage('');
        const form = new FormData();
        form.append('file', file);
        try {
          const data = await apiSend('/admin/settings/upload/campaign', 'POST', form);
          setSettings((prev) => ({ ...prev, campaign_file: data.filename || prev.campaign_file }));
          setMessage(data.message || 'Campaign file uploaded');
        } catch (err) {
          setMessage(err.message || 'Upload failed');
        } finally {
          setCampaignUploading(false);
        }
      }

      async function importCampaign() {
        setImportingCampaign(true);
        setImportResult(null);
        setMessage('');
        try {
          const data = await apiSend('/admin/campaign/import', 'POST');
          setImportResult(data);
          setMessage('Campaign import completed successfully');
        } catch (err) {
          setImportResult({ ok: false, error: err.message || 'Import failed' });
          setMessage(err.message || 'Import failed');
        } finally {
          setImportingCampaign(false);
        }
      }

      async function uploadCalendarFile(file) {
        if (!file) return;
        const ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
        if (!CALENDAR_ACCEPTED_EXTENSIONS.includes(ext)) {
          setMessage('Unsupported file type. Supported: XLSX, XLS');
          return;
        }
        setCalendarUploading(true);
        setMessage('');
        const form = new FormData();
        form.append('file', file);
        try {
          const data = await apiSend('/admin/settings/upload/calendar', 'POST', form);
          setSettings((prev) => ({ ...prev, calendar_file: data.filename || prev.calendar_file }));
          setMessage(data.message || 'Calendar file uploaded');
        } catch (err) {
          setMessage(err.message || 'Upload failed');
        } finally {
          setCalendarUploading(false);
        }
      }

      async function changePassword(e) {
        e.preventDefault();
        setPasswordMsg('');
        if (!passwordOld || !passwordNew || !passwordConfirm) {
          setPasswordMsg('All fields are required');
          return;
        }
        if (passwordNew !== passwordConfirm) {
          setPasswordMsg('New passwords do not match');
          return;
        }
        if (passwordNew.length < 4) {
          setPasswordMsg('New password must be at least 4 characters');
          return;
        }
        try {
          const data = await apiSend('/admin/settings/change-password', 'POST', {
            old_password: passwordOld,
            new_password: passwordNew,
          });
          setPasswordMsg(data.message || 'Password changed successfully');
          setPasswordOld('');
          setPasswordNew('');
          setPasswordConfirm('');
        } catch (err) {
          setPasswordMsg(err.message || 'Password change failed');
        }
      }

      // Bot section
      const botSection = React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
        React.createElement('h2', { style: { marginTop: 0, marginBottom: '16px' } }, 'Bot'),
        React.createElement('form', { className: 'form-grid', onSubmit: saveBotSettings },
          React.createElement('label', null, 'Bot Name',
            React.createElement('input', {
              value: settings.bot_name || '',
              onChange: (e) => setSettings({ ...settings, bot_name: e.target.value })
            })
          ),
          React.createElement('label', null, 'System Prompt',
            React.createElement('textarea', {
              value: settings.system_prompt || '',
              onChange: (e) => setSettings({ ...settings, system_prompt: e.target.value })
            })
          ),
          React.createElement('button', { className: 'btn', type: 'submit' }, 'Save Bot Settings')
                  )
      );

      // AI section
      const aiSection = React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
        React.createElement('h2', { style: { marginTop: 0, marginBottom: '16px' } }, 'AI'),
        React.createElement('form', { className: 'form-grid', onSubmit: saveAiSettings },
          React.createElement('label', null, 'Gemini API Key',
            React.createElement('input', {
              value: settings.gemini_api_key || '',
              onChange: (e) => setSettings({ ...settings, gemini_api_key: e.target.value }),
              placeholder: 'Enter new API key (masked when saved)',
              type: 'text'
            })
          ),
          React.createElement('label', null, 'Gemini Model',
            React.createElement('input', {
              value: settings.gemini_model || 'gemini-2.5-flash',
              onChange: (e) => setSettings({ ...settings, gemini_model: e.target.value }),
              placeholder: 'gemini-2.5-flash'
            })
          ),
          React.createElement('button', { className: 'btn', type: 'submit' }, 'Save AI Settings')
                  )
      );

      // Campaign File section
      const campaignSection = React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
        React.createElement('h2', { style: { marginTop: 0, marginBottom: '8px' } }, 'Campaign List File'),
        React.createElement('p', { className: 'muted' }, 'Allowed: XLSX, XLS'),
        React.createElement('div', {
          className: 'drop-zone',
          style: campaignDragging ? { borderColor: 'var(--gold-soft)', background: 'rgba(227,168,87,0.12)' } : null,
          onDragOver: (e) => { e.preventDefault(); setCampaignDragging(true); },
          onDragLeave: () => setCampaignDragging(false),
          onDrop: (e) => {
            e.preventDefault();
            setCampaignDragging(false);
            const file = e.dataTransfer.files?.[0];
            if (file) uploadCampaignFile(file);
          }
        },
          React.createElement('h3', { style: { margin: '0 0 10px', fontSize: '18px' } }, campaignUploading ? 'Uploading...' : 'Drop file or click to upload'),
          React.createElement('p', { className: 'muted' }, 'XLSX, XLS'),
          React.createElement('label', { className: 'btn', htmlFor: 'campaign-upload-input' }, campaignUploading ? 'Uploading...' : 'Choose File'),
          React.createElement('input', {
            id: 'campaign-upload-input',
            type: 'file',
            accept: CAMPAIGN_FILE_ACCEPT_ATTR,
            style: { display: 'none' },
            onChange: (e) => uploadCampaignFile(e.target.files?.[0])
          })
        ),
        React.createElement('div', { style: { marginTop: '14px' } },
          React.createElement('div', { className: 'label' }, 'Current File'),
          React.createElement('div', { style: { color: 'var(--sand)' } }, settings.campaign_file || 'No file uploaded'),
          settings.campaign_file ? React.createElement('div', { className: 'muted', style: { marginTop: '4px' } }, 'Upload date available in database') : null
        ),
        React.createElement('div', { style: { marginTop: '18px', borderTop: '1px solid var(--line)', paddingTop: '16px' } },
          React.createElement('button', {
            className: 'btn',
            onClick: importCampaign,
            disabled: importingCampaign || !settings.campaign_file
          }, importingCampaign ? 'Importing...' : 'Import Campaign'),
          importResult && React.createElement('div', { style: { marginTop: '14px' } },
            importResult.ok ? React.createElement('div', { className: 'card', style: { padding: '14px', background: 'rgba(95,176,120,0.08)' } },
              React.createElement('div', { className: 'label' }, 'Import Summary'),
              React.createElement('div', { style: { display: 'flex', gap: '20px', flexWrap: 'wrap', marginTop: '8px' } },
                React.createElement('div', null, React.createElement('span', { className: 'muted' }, 'Total Rows: '), React.createElement('strong', null, importResult.total_rows)),
                React.createElement('div', null, React.createElement('span', { className: 'muted' }, 'Imported: '), React.createElement('strong', { style: { color: '#7fd49a' } }, importResult.imported)),
                React.createElement('div', null, React.createElement('span', { className: 'muted' }, 'Updated: '), React.createElement('strong', { style: { color: 'var(--gold-soft)' } }, importResult.updated)),
                React.createElement('div', null, React.createElement('span', { className: 'muted' }, 'Skipped: '), React.createElement('strong', null, importResult.skipped))
              )
            ) : React.createElement('div', { className: 'message' }, importResult.error || 'Import failed')
          )
        )
      );

      // Calendar File section
      const calendarSection = React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
        React.createElement('h2', { style: { marginTop: 0, marginBottom: '8px' } }, 'Calendar File'),
        React.createElement('p', { className: 'muted' }, 'Allowed: XLSX, XLS'),
        React.createElement('div', {
          className: 'drop-zone',
          style: calendarDragging ? { borderColor: 'var(--gold-soft)', background: 'rgba(227,168,87,0.12)' } : null,
          onDragOver: (e) => { e.preventDefault(); setCalendarDragging(true); },
          onDragLeave: () => setCalendarDragging(false),
          onDrop: (e) => {
            e.preventDefault();
            setCalendarDragging(false);
            const file = e.dataTransfer.files?.[0];
            if (file) uploadCalendarFile(file);
          }
        },
          React.createElement('h3', { style: { margin: '0 0 10px', fontSize: '18px' } }, calendarUploading ? 'Uploading...' : 'Drop file or click to upload'),
          React.createElement('p', { className: 'muted' }, 'XLSX, XLS'),
          React.createElement('label', { className: 'btn', htmlFor: 'calendar-upload-input' }, calendarUploading ? 'Uploading...' : 'Choose File'),
          React.createElement('input', {
            id: 'calendar-upload-input',
            type: 'file',
            accept: CALENDAR_ACCEPT_ATTR,
            style: { display: 'none' },
            onChange: (e) => uploadCalendarFile(e.target.files?.[0])
          })
        ),
        React.createElement('div', { style: { marginTop: '14px' } },
          React.createElement('div', { className: 'label' }, 'Current File'),
          React.createElement('div', { style: { color: 'var(--sand)' } }, settings.calendar_file || 'No file uploaded'),
          settings.calendar_file ? React.createElement('div', { className: 'muted', style: { marginTop: '4px' } }, 'Upload date available in database') : null
        )
      );

      // Security section
      const securitySection = React.createElement('div', { className: 'card', style: { marginBottom: '18px' } },
        React.createElement('h2', { style: { marginTop: 0, marginBottom: '8px' } }, 'Security'),
        React.createElement('p', { className: 'muted', style: { marginBottom: '16px' } }, 'Change Password'),
        React.createElement('form', { className: 'form-grid', onSubmit: changePassword },
          React.createElement('label', null, 'Current Password',
            React.createElement('input', {
              type: 'password',
              value: passwordOld,
              onChange: (e) => setPasswordOld(e.target.value)
            })
          ),
          React.createElement('label', null, 'New Password',
            React.createElement('input', {
              type: 'password',
              value: passwordNew,
              onChange: (e) => setPasswordNew(e.target.value)
            })
          ),
          React.createElement('label', null, 'Confirm New Password',
            React.createElement('input', {
              type: 'password',
              value: passwordConfirm,
              onChange: (e) => setPasswordConfirm(e.target.value)
            })
          ),
          React.createElement('button', { className: 'btn', type: 'submit' }, 'Change Password'),
                    React.createElement('div', { className: 'message' }, passwordMsg)
                  )
      );

      return React.createElement('div', null,
        React.createElement('h1', { className: 'page-title' }, 'Settings'),
        React.createElement('p', { className: 'subtext' }, 'Configure the chatbot settings.'),
        botSection,
        aiSection,
        campaignSection,
        calendarSection,
        securitySection,
        React.createElement('div', { className: 'message' }, message)
      );
    }

    function AuditView() {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        apiGet('/admin/audit?limit=100')
          .then((data) => setEvents(data.events || []))
          .catch(() => setEvents([]))
          .finally(() => setLoading(false));
      }, []);
      return React.createElement('div', null,
        React.createElement('h1', { className: 'page-title' }, 'Audit Logs'),
        loading
          ? React.createElement('div', { className: 'muted' }, 'Loading...')
          : (events.length === 0
              ? React.createElement('div', { className: 'muted' }, 'No audit events yet.')
              : React.createElement('table', { className: 'table' },
                  React.createElement('thead', null,
                    React.createElement('tr', null,
                      ['Action', 'Entity', 'Actor', 'When'].map((h) =>
                        React.createElement('th', { key: h }, h)
                      )
                    )
                  ),
                  React.createElement('tbody', null,
                    events.map((e) =>
                      React.createElement('tr', { key: e.id },
                        React.createElement('td', null, e.action),
                        React.createElement('td', null, `${e.entity_type} #${e.entity_id || ''}`),
                        React.createElement('td', null, e.actor_id || e.actor_type),
                        React.createElement('td', null, formatUploadDate(e.occurred_at))
                      )
                    )
                  )
                ))
      );
    }

    function AdminApp() {
      const [activeView, setActiveView] = useState('dashboard');

      const views = {
        dashboard: DashboardView,
        knowledge: KnowledgeBaseView,
        campaigns: CampaignsView,
        reports: ReportsView,
        audit: AuditView,
        settings: SettingsView,
      };
      const ActiveView = views[activeView] || DashboardView;

      return React.createElement('div', { className: 'admin-shell' },
        React.createElement(Sidebar, { active: activeView, onSelect: setActiveView }),
        React.createElement('main', { className: 'main-panel' },
          React.createElement(ActiveView)
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('admin-root')).render(React.createElement(AdminApp));
  </script>
</body>
</html>
